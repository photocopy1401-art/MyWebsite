<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرم ورود</title>
    <style>
        body{
            background: linear-gradient(135deg, #101828, #263653, #17152e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            
            display: flex;
            justify-content: center; /*وسط افق*/
            align-items: center;     /*وسط عمودی */
            height: 100vh;
            margin: 0;

        }
        form{
            width: 400px;
            height: 500px;

            background:  linear-gradient(145deg, #202B45, #293957);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            padding: 30px;
            border: 3px solid #8B5CF6;
            border-radius:15px;
            box-sizing: border-box;
            boX-shadow: 0 0 25px rgba(255, 247, 245, 0.35);
            text-align:center;
        }
        h2{
            color: #A78BFA;
            font-size: 50px;
            font-weight: bold;
            text-shadow: 0 0 12px rgba(167, 139, 250, 0.5);

        }
        label {
            display: block;
            text-align: right;
            margin-bottom: 8px;
            font-size: 18px;
            font-weight: bold;
            font-size: 30px;
            background-position: center;
            text-align: center;
            color: #F472B6;


        }

        input[type="email"],
        input[type="text"],
        input[type="password"]{
            width:100%;
            padding: 10px;
            margin-bottom: 20px;
            border:2px solid #5EEAD4;
            border-radius:8px;
            box-sizing:border-box;

        }
        
        input[type="email"],
        input[type="text"],
        input[type="password"] {
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: 16px;
        }

        #message {
            display: none;
            color: #5EEAD4;
            font-weight: bold;
            margin-top: 20px;
        }

        input[type="submit"] {
            font-family: Tahoma, sans-serif;
            font-size: 18px;
            font-weight: bold;
        }
        .buttonClass {
            display: inline-block;
            background: linear-gradient(135deg, #5EEAD4, #38BDF8);
            color:#101828;
            padding: 10px 30px;
            border: 3px solid white;
            border-radius: 10px;
            cursor: pointer;
            font-family: Tahoma, sans-serif;
            font-weight: bold;
        }
        .buttonClass:hover {
            background: rgb(216, 31, 176);
        }

    </style>
</head>
<body dir="rtl">
    <form id="loginform">
        <h2>فرم ورود </h2>
        <label for="username">آدرس ایمیل:</label>
        <input type="email" id="username" required><br><br>

        <label for="password">رمز عبور:</label>
        <input type="text" id="password" required><br><br>
   <!-- برای این که کلمه های نوشته شده در گزینه پسورد نشان داده شود تایپ رو از پسورد به تکست تغییر دادم
    /*<input type="password" id="password" required><br><br> اصلی*/
    /*<input type="text" id="password" required><br><br> تغییر کرده  */ 
    -->


        <button type="button" id="button" class="buttonClass"> ورود </button>

        <p id="message">نام کاربری و رمز عبور ذخیره شد</p>
    </form>
    <script>
        

      var form = document.getElementById("loginform");
      var username = document.getElementById("username");
      var password = document.getElementById("password");
      var message = document.getElementById("message");

      var btn = document.getElementById("button");
      btn.onclick = function() {
      if (username.value.trim() === "") {
            message.style.display = "block";
            message.textContent = "لطفاً آدرس جیمیل را وارد کنید!";
            username.focus();
       }

        else if (!username.validity.valid) {
            message.style.display = "block";
            message.textContent = "لطفاً یک آدرس جیمیل معتبر وارد کنید!";
            username.focus();
        }

        else if (password.value.trim() === "") {
            message.style.display = "block";
            message.textContent = "لطفاً رمز عبور را وارد کنید!";
            password.focus();
        }

        else {
            message.style.display = "none";
            window.location.href = "home.html";
        }
        
      }

    </script>
</body>
</html>

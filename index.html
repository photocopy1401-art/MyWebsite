<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرم ورود</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #F1F5FB;
            font-family: Tahoma, sans-serif;
            padding: 20px;
        }

        form {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h2 {
            color: #172B4D;
            font-size: 32px;
            margin-bottom: 35px;
        }

        label {
            display: block;
            text-align: right;
            font-size: 15px;
            font-weight: bold;
            color: #344563;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 12px;
            margin-bottom: 22px;
            border: 1px solid #D5DDE9;
            border-radius: 10px;
            font-size: 15px;
            font-family: Tahoma, sans-serif;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .buttonClass {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 10px;
            background: #2563EB;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .buttonClass:hover {
            background: #1D4ED8;
            transform: translateY(-2px);
        }

        #message {
            display: none;
            margin-top: 20px;
            font-size: 14px;
            font-weight: bold;
        }


            h2 {
                font-size: 28px;
            }
        
        .music-player {
            width: 300px;
            max-width: 100%;
            margin: 20px auto;
            padding: 15px;
            background: white;
            border: 1px solid #D5DDE9;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .music-player p {
            color: #2563EB;
            font-family: Tahoma;
            font-weight: bold;
        }

        .music-player button {
            background: #2563EB;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            font-family: Tahoma;
        }

        .music-player button:hover {
            background: #1D4ED8;
        }

        .music-player audio {
            width: 100%;
        }

         

    </style>
</head>
<body dir="rtl">
    <form id="loginform">
        <h2>فرم ورود </h2>
        <label for="username">آدرس ایمیل:</label>
        <input type="email" id="username" required><br><br>

        <label for="password">رمز عبور:</label>
        <input type="text" id="password" required><br><br>
   <!-- برای این که کلمه های نوشته شده در گزینه پسورد نشان داده شود تایپ رو از پسورد به تکست تغییر دادم
    /*<input type="password" id="password" required><br><br> اصلی*/
    /*<input type="text" id="password" required><br><br> تغییر کرده  */ 
    -->


        <button type="button" id="button" class="buttonClass"> ورود </button>

        <p id="message">نام کاربری و رمز عبور ذخیره شد</p>
        
        <div class="music-player">

            <p>🎵 موسیقی سایت</p>

            <audio controls autoplay loop>
                <source src="124.mp3" type="audio/mpeg">
                    مرورگر شما از پخش موسیقی پشتیبانی نمی‌کند.
            </audio>

        </div>       

    </form>


    <script>
        

      var form = document.getElementById("loginform");
      var username = document.getElementById("username");
      var password = document.getElementById("password");
      var message = document.getElementById("message");

      var btn = document.getElementById("button");
      btn.onclick = function() {
      if (username.value.trim() === "") {
            message.style.display = "block";
            message.textContent = "لطفاً آدرس ایمیل را وارد کنید!";
            username.focus();
       }

        else if (!username.validity.valid) {
            message.style.display = "block";
            message.textContent = "لطفاً یک آدرس ایمیل معتبر وارد کنید!";
            username.focus();
        }

        else if (password.value.trim() === "") {
            message.style.display = "block";
            message.textContent = "لطفاً رمز عبور را وارد کنید!";
            password.focus();
        }

        else {
            message.style.display = "none";
            window.location.href = "home.html";
        }
        
      }

    </script>
</body>
</html>
